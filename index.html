<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rake · If Can Can</title>

    <!-- Link preview. Without these a shared URL renders as a bare card in
         iMessage/Slack/Discord, which is most of how this app gets opened.
         og:image must be an ABSOLUTE url — scrapers don't resolve relative
         paths — and 1200x630 is the ratio every platform crops toward. -->
    <meta name="description" content="Live category standings for a fantasy baseball money league — home runs, batting average, wins and ERA." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="rake" />
    <meta property="og:title" content="If Can Can, No Can Garbage Can" />
    <meta property="og:description" content="Live category standings — home runs, batting average, wins and ERA." />
    <meta property="og:url" content="https://if-can-can.vercel.app/" />
    <meta property="og:image" content="https://if-can-can.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="If Can Can, No Can Garbage Can" />
    <meta name="twitter:description" content="Live category standings — home runs, batting average, wins and ERA." />
    <meta name="twitter:image" content="https://if-can-can.vercel.app/og.png" />
    <!-- Tints the browser chrome on mobile to match the app's ground. -->
    <meta name="theme-color" content="#FFFFFF" />

    <!-- Modern browsers use the crisp SVG; the PNG is a fallback for those that
         don't support SVG favicons; apple-touch-icon covers iOS home screen. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Neue Haas Unica (UI) is @font-face'd below from public/fonts; Bricolage
         (wordmark) is imported via @fontsource in main.jsx. -->
    <style>
      /* ---- Neue Haas Unica Pro — self-hosted (Google CDN blocked here) ---- */
      @font-face { font-family:'Neue Haas Unica'; src:url('/fonts/neue-haas/NeueHaasUnicaPro-Light.ttf') format('truetype'); font-weight:300; font-style:normal; font-display:swap; }
      @font-face { font-family:'Neue Haas Unica'; src:url('/fonts/neue-haas/NeueHaasUnicaPro-Regular.ttf') format('truetype'); font-weight:400; font-style:normal; font-display:swap; }
      @font-face { font-family:'Neue Haas Unica'; src:url('/fonts/neue-haas/NeueHaasUnicaPro-Medium.ttf') format('truetype'); font-weight:500; font-style:normal; font-display:swap; }
      @font-face { font-family:'Neue Haas Unica'; src:url('/fonts/neue-haas/NeueHaasUnicaPro-Bold.ttf') format('truetype'); font-weight:700; font-style:normal; font-display:swap; }

      html, body, #root { margin: 0; height: 100%; }
      /* Native anchor jumps, eased. The landing bars aren't sticky, so no
         scroll offset is needed — only the easing. */
      html { scroll-behavior: smooth; }
      @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
      body { text-rendering: optimizeLegibility; background: #F3F4F6; }
      * { box-sizing: border-box; }

      :root {
        --rk-font: 'Neue Haas Unica', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        --rk-font-wordmark: 'Bricolage Grotesque Variable', 'Bricolage Grotesque', sans-serif;
        /* Hairlines run edge-to-edge while content stays centred in a 1040px
           column: sections pad by this gutter, and full-bleed rows cancel it
           with an equal negative margin. */
        --rk-gutter: max(22px, calc((100vw - 1040px) / 2));
      }

      /* ---- Loader + change-flash animations ---- */
      @keyframes bt-spin { to { transform: rotate(360deg); } }
      .bt-spin { animation: bt-spin 0.8s linear infinite; }
      @keyframes bt-dot-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
      .bt-dot-pulse { animation: bt-dot-pulse 1.15s ease-in-out infinite; }
      @keyframes bt-flip { 0% { transform: rotateY(-90deg); opacity: 0; } 55% { opacity: 1; } 100% { transform: rotateY(0); opacity: 1; } }
      .bt-flip { animation: bt-flip 0.34s cubic-bezier(0.4, 0, 0.2, 1); }
      @keyframes bt-shimmer { to { background-position: -200% 0; } }
      .bt-shimmer { background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; animation: bt-shimmer 1.8s linear infinite; }
      @keyframes bt-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      .bt-rise { animation: bt-rise 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }
      /* Hold the tint at full strength for the first third, THEN fade. It used
         to start fading from frame one, so a change that happened while you
         were reading elsewhere on the page was easy to miss entirely. */
      @keyframes bt-flash-up { 0%, 34% { background-color: rgba(0,118,182,.18); } 100% { background-color: transparent; } }
      @keyframes bt-flash-down { 0%, 34% { background-color: rgba(194,59,34,.18); } 100% { background-color: transparent; } }
      /* The flashed cells are grid children in a row set to align-items:center,
         so they're sized to their TEXT height — the tint painted a thin band
         instead of filling the cell. Stretching to the row height (and
         re-centring the content inside) makes the flash fill the full cell. */
      .bt-flash-up, .bt-flash-down { align-self: stretch; display: flex; align-items: center; justify-content: center; }
      .bt-flash-up { animation: bt-flash-up 2.6s ease-out; }
      .bt-flash-down { animation: bt-flash-down 2.6s ease-out; }
      .bt-no-transition * { transition: none !important; }
      /* Theme flip: a single cross-fade of the whole page (see startViewTransition
         in theme.js). Slightly slower than the browser default so it reads as a
         deliberate dissolve rather than a blink. */
      ::view-transition-old(root),
      ::view-transition-new(root) { animation-duration: .32s; animation-timing-function: cubic-bezier(.4, 0, .2, 1); }
      @media (prefers-reduced-motion: reduce) {
        ::view-transition-old(root),
        ::view-transition-new(root) { animation: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        .bt-flip, .bt-shimmer, .bt-rise { animation: none; }
        .bt-dot-pulse { animation: none; opacity: 0.85; }
      }

      /* ==========================================================================
         Rake 2.0 — type & surface system. Colours come from CSS vars set per theme
         in theme.js, so every class stays light⇄dark aware. Zero radius, no shadows.
         ========================================================================== */
      /* ---- Type scale ----------------------------------------------------
         Every text role in the app maps to exactly ONE of these. Before this
         pass, roles that are functionally identical (a "name", a "label", a
         "caption") had each invented their own one-off size — 9, 9.5, 10,
         10.5, 11, 11.5, 12, 12.5, 13, 13.5, 15, 16, 17, 18px all in play for
         maybe 6 real jobs. That drift is what read as messy. Fixed sizes below;
         do not add a new one-off — reuse a role.

         wordmark   25px  Bricolage 800   — brand only, not part of this scale
         title      17px  Medium 500      — the league name (page identity)
         section    15px  Bold 700        — "Leaders" / "Standings" / etc.
         name       14px  Medium 500      — team name in a table row
         name-sm    12.5px Medium 500     — team name in a dense list (picker,
                                             dropdown, award list, empty chips)
         body       14px  Regular 400     — data cells, prompts
         figure     34px  Bold 700 accent — hero stat numbers
         caption    12px  Regular 400     — supporting notes (caveats, margins)
         label      10.5px Bold 700 caps  — eyebrows, column headers, payout
                                             line, modal section labels
         label-lt   10.5px Medium 500 caps — column headers specifically: same
                                             size as label, one step lighter
                                             (bold column headers on every row
                                             read as too heavy; but 400 read as
                                             not enough of a header at all)
         micro      9px   Bold 700 caps   — small inline badges (LIVE, Current)
         ---------------------------------------------------------------- */
      .rk-league-title { font: 500 17px/1.15 var(--rk-font); letter-spacing: 0; color: var(--rk-title); overflow: visible; transition: font-size .2s ease; }
      .rk-league-title.is-condensed { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      /* Same bold-caps language as the nav tabs (just bigger) — the two now
         read as one family of "structural heading" instead of two different
         typographic ideas. Markup stays title-case ("Leaders"); this
         transforms the display only. */
      /* Bold 700 is the ceiling in this family, so loudness comes from size and
         tracking instead. Caps get POSITIVE tracking at label sizes for
         legibility, but at display size that same spacing reads timid — pulling
         it negative is what makes big caps feel set rather than typed. */
      .rk-section-head { font: 700 27px/1.05 var(--rk-font); letter-spacing: -.012em; text-transform: uppercase; color: var(--rk-title); white-space: nowrap; }
      .rk-body { font: 400 14px/1.4 var(--rk-font); color: var(--rk-grey); }
      .rk-caveat { font: 400 12px/1.5 var(--rk-font); color: var(--rk-grey); max-width: 520px; }
      .rk-nav { font: 500 13.5px/1 var(--rk-font); letter-spacing: .04em; text-transform: uppercase; color: var(--rk-grey); background: none; border: 0; padding: 0; cursor: pointer; transition: color .14s ease; }
      .rk-nav:hover { color: var(--rk-title); }
      .rk-nav.is-active { color: var(--rk-title); }
      .rk-eyebrow { font: 400 10.5px/1 var(--rk-font); letter-spacing: .03em; text-transform: uppercase; color: var(--rk-title); }
      /* The "2026 SEASON · 8 TEAMS · UPDATED …" line under the title. Its own
         class (not a blanket .rk-eyebrow override, which also styles Leaders
         labels and the payout line) so it can be tuned to actually fit one line. */
      /* Not bold: now that this grey is darker, Bold made the metadata compete
         with the league title directly above it. Medium keeps it legible while
         letting the title lead. */
      .rk-meta-line { gap: 7px; margin-top: 7px; font-weight: 500; }
      /* Medium: heavier than the 400 data cells so headers read as headers,
         but lighter than the 700 label role — a full bold row of column
         headers over every row was what read as "too bold" for the table. */
      /* Black and Regular like the eyebrows, but a step smaller with slightly
         wider tracking: sitting directly above 13px data, a same-size header
         row read at nearly equal weight and the table went flat. Size does the
         hierarchy here so the labels can stay black rather than going grey. */
      .rk-colhead { font: 400 9.5px/1 var(--rk-font); letter-spacing: .05em; text-transform: uppercase; color: var(--rk-title); }
      /* The hero. These four numbers are the one thing on the page allowed to be
         genuinely large — everything else is label or table. Tracking goes more
         negative as the size climbs (digits close up faster than letters), and
         line-height drops below 1 so the figure sits tight in its cell. */
      .rk-figure { font: 700 62px/.88 var(--rk-font); letter-spacing: -.022em; color: var(--rk-accent); font-variant-numeric: tabular-nums; }
      .rk-team-name { font: 500 14px/1.2 var(--rk-font); letter-spacing: .018em; color: var(--rk-title); }
      /* Compact team name — dropdown trigger/options, empty-state chips, the
         award-list under each Leaders figure. One size for all four instead of
         four near-identical one-offs (12 / 12.5 / 13 / 13). */
      .rk-team-name-sm { font: 500 12.5px/1.25 var(--rk-font); letter-spacing: .012em; color: var(--rk-ink); }
      /* Regular for values; the leader is already marked by accent blue, so it
         only needs Medium — Bold on top of blue was double-marking. */
      .rk-data { font: 400 14px/1 var(--rk-font); letter-spacing: 0; color: var(--rk-ink); font-variant-numeric: tabular-nums; }
      .rk-data.is-leader { font-weight: 500; color: var(--rk-accent); }
      .rk-data.is-record { color: var(--rk-grey); }
      .rk-data.is-rank   { color: var(--rk-title); }

      /* Controls — hairline outlined, square, never filled */
      .rk-btn { font: 700 10.5px/1 var(--rk-font); letter-spacing: .05em; text-transform: uppercase; color: var(--rk-title); background: none; border: 1px solid var(--rk-title); padding: 9px 14px; white-space: nowrap; cursor: pointer; transition: background .14s ease, color .14s ease; }
      .rk-btn:hover { background: var(--rk-title); color: var(--rk-paper); }
      /* A single dot from the mark's own matrix, rather than an outlined pill —
         one less box on a page built from hairlines, and it ties the live state
         back to the logo. Radius is 16% of the square, matching DotArt's rx. */
      .rk-badge-live { display: inline-flex; align-items: center; gap: 6px; font: 700 10px/1 var(--rk-font); letter-spacing: .08em; text-transform: uppercase; color: var(--rk-accent); white-space: nowrap; }
      .rk-live-dot { width: 9px; height: 9px; border-radius: 1.44px; background: var(--rk-accent); flex-shrink: 0; }
      /* Team picker trigger — a real button now (was a native <select>, which
         couldn't show a team logo and read as stock browser chrome). */
      /* Same language as "All 17 weeks" — an underlined caps text control, not a
         boxed form field. The bordered select was the only input-looking chrome
         left on a page that otherwise has none. */
      /* A plain accent-blue text action beside the team name — no box, no
         chevron. Blue already means "actionable/live" everywhere else here. */
      .rk-team-select { display: inline-flex; align-items: center; padding: 0; font: 500 9px/1 var(--rk-font); letter-spacing: .05em; text-transform: uppercase; color: var(--rk-accent); background: none; border: 0; cursor: pointer; flex-shrink: 0; transition: opacity .14s ease; }
      .rk-team-select:hover { opacity: .6; }
      .rk-team-select:focus-visible { outline: 1px solid var(--rk-accent); outline-offset: 3px; }

      /* Team picker dropdown list */
      .rk-team-listbox { position: absolute; z-index: 10; top: calc(100% + 4px); right: 0; min-width: 220px; max-height: 320px; overflow-y: auto; margin: 0; padding: 4px; list-style: none; background: var(--rk-paper); border: 1px solid var(--rk-line); box-shadow: 0 8px 24px rgba(0,0,0,.1); }
      .rk-team-option { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 9px; background: none; border: 0; text-align: left; cursor: pointer; }
      .rk-team-option:hover { background: var(--rk-hover); }
      .rk-team-option.is-sel { background: var(--rk-sel); color: var(--rk-title); }

      /* Empty state as a picker — a grid of tappable team chips instead of a
         generic icon + "no data" copy. */
      /* Fixed 2 columns, not auto-fill — auto-fill produced 3 columns at this
         width, and 8 teams into 3 columns leaves a dangling empty 9th cell (a
         visible blank hole, since this container's own line-colored
         background shows through any unfilled grid track. That grid-of-boxes
         approach was replaced below with an open row of logos — no boxes,
         no dangling-cell risk since it just wraps.) */
      /* Orbit picker — no card, no box, floats directly on the page.
         Coverflow: size/opacity/desaturation are driven CONTINUOUSLY off each
         circle's live pixel-distance from the track's centre (direct inline
         style from the scroll handler in BaseballTracker.jsx). Max-width caps
         the window to about 5 circles regardless of how wide the desktop
         column is, so it always reads as a focused fan, not a sprawling row. */
      /* The wrapper carries the max-width, NOT the scroll track itself. The
         track's `padding: calc(50% - 26px)` resolves its 50% against its
         PARENT's width — so putting max-width on the track produced 397px of
         padding per side (794px total) that could never fit inside 380px, and
         the constraint was silently ignored. With the cap on the wrapper, the
         50% resolves against 380px and the centring padding works. */
      .rk-team-orbit-wrap { max-width: 440px; margin: 0 auto; }
      .rk-orbit-hint { font: 400 9px/1 var(--rk-font); letter-spacing: .09em; text-transform: uppercase; color: var(--rk-title); text-align: center; margin-top: 4px; }
      .rk-team-orbit { position: relative; display: flex; align-items: center; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; padding: 18px calc(50% - 26px) 40px; scrollbar-width: none; -webkit-mask-image: linear-gradient(to right, transparent, black 14%, black 86%, transparent); mask-image: linear-gradient(to right, transparent, black 14%, black 86%, transparent); }
      .rk-team-orbit::-webkit-scrollbar { display: none; }
      .rk-team-orb { position: relative; flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; background: none; border: 0; padding: 4px; cursor: pointer; scroll-snap-align: center; }
      /* Default (pre-JS-measure) state only — the scroll handler overrides
         transform/opacity/filter inline every frame once mounted. */
      /* Hairline ring — gives each mark a defined edge so logos with white or
         transparent backgrounds don't bleed into the page. Outset (not inset):
         an inset shadow doesn't paint on replaced elements like <img>. */
      .rk-team-orb .bt-teammark, .rk-team-orb img { filter: grayscale(.7); opacity: .55; transform: scale(.75); box-shadow: 0 0 0 1px var(--rk-line); }
      /* Dot-matrix backdrop — the brand's own dot-grid motif (same language as
         the logo/loader), in the single app accent blue (not a per-team
         colour), revealed on hover. The radial mask fades the dot circle's
         OWN edge to nothing, so it blends into the page instead of a hard
         circular cutoff. */
      .rk-team-orb-avatar { position: relative; display: flex; align-items: center; justify-content: center; }
      /* Brand dot language: ROUNDED SQUARES on a grid (same construction as
         DotArt in BaseballTracker.jsx — square dots, ~12% gap, 16% corner
         radius), not generic round CSS dots. Drawn as a tiled SVG so the
         corner radius survives. Grey, faded radially at its own edge. */
      /* Tile/dot ratio mirrors DotArt's own construction in BaseballTracker.jsx
         (gap ≈ 12–30% of the dot, corner radius ≈ 16%) so this reads as the
         same dot-matrix as the logo. The previous 8px tile with a 3.2px dot
         left gaps 1.5× the dot size — far too airy to match the mark. */
      /* Drawn as a MASK rather than a background-image so the colour lives in
         CSS and can follow the theme — with the dots baked into an SVG fill they
         were stuck one grey and couldn't tint on hover. Two mask layers, the dot
         grid intersected with a radial fade so the motif dissolves at its edge. */
      .rk-team-orb-dots {
        position: absolute; inset: -35%;
        background-color: var(--rk-muted);
        -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='5' height='5'><rect x='0' y='0' width='3.9' height='3.9' rx='0.62' fill='%23000'/></svg>"), radial-gradient(circle, black 28%, transparent 70%);
        mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='5' height='5'><rect x='0' y='0' width='3.9' height='3.9' rx='0.62' fill='%23000'/></svg>"), radial-gradient(circle, black 28%, transparent 70%);
        -webkit-mask-size: 5px 5px, 100% 100%; mask-size: 5px 5px, 100% 100%;
        -webkit-mask-composite: source-in; mask-composite: intersect;
        opacity: 0; transform: scale(.85);
        transition: opacity .22s ease, transform .22s ease, background-color .22s ease;
        pointer-events: none;
      }
      /* The centred orb carries the motif in grey on EVERY device — it marks
         what's selected, which is true whether or not a pointer exists. (This
         was previously scoped to touch only, so desktop showed nothing until
         you happened to hover.) */
      .rk-team-orb.is-active .rk-team-orb-dots { opacity: .45; transform: scale(1); }
      /* Hover is the extra layer on top: same motif, tinted to the accent. */
      .rk-team-orb:hover .rk-team-orb-dots, .rk-team-orb:focus-visible .rk-team-orb-dots { opacity: .45; transform: scale(1); background-color: var(--rk-accent); }
      /* Absolutely positioned so the (hidden) names of INACTIVE circles don't
         set each button's width — otherwise every orb was as wide as its team
         name and the circles were pushed far apart. Out of flow, so spacing is
         driven purely by the 52px avatars. */
      .rk-team-orb-name { position: absolute; top: calc(100% + 4px); left: 50%; font: 700 13px/1.15 var(--rk-font); letter-spacing: .02em; text-transform: uppercase; color: var(--rk-grey); opacity: 0; transform: translateX(-50%) translateY(-2px); transition: opacity .18s ease, transform .18s ease, color .18s ease; max-width: 150px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
      .rk-team-orb.is-active .rk-team-orb-name { opacity: 1; transform: translateX(-50%); color: var(--rk-title); font-weight: 800; }
      .rk-iconbtn { display: inline-flex; align-items: center; justify-content: center; background: none; border: 0; padding: 4px; color: var(--rk-grey); cursor: pointer; transition: color .14s ease, transform .1s ease; }
      .rk-iconbtn:hover:not(:disabled) { color: var(--rk-title); }
      .rk-iconbtn:active:not(:disabled) { transform: scale(0.9); }
      .rk-updated { background: none; border: 0; padding: 0; cursor: pointer; color: inherit; font: inherit; transition: color .14s ease; }
      .rk-updated:hover:not(:disabled) { color: var(--rk-accent); }

      /* Surfaces */
      /* 18px matches the footer's own padding, so the space below the mark is
         the same as above it instead of the footer's 18px plus a trailing 24. */
      .rk-shell { padding: 8px 0 18px; }
      .rk-card { background: var(--rk-paper); }
      /* Sticky app bar — the nav + shrinking league title stay pinned to the top. */
      .rk-sticky { position: sticky; top: 0; z-index: 20; background: var(--rk-paper); border-top: 1px solid var(--rk-line); border-bottom: 1px solid var(--rk-line); }
      .rk-section + .rk-section { border-top: 1px solid var(--rk-line); }
      .rk-section + .rk-section.rk-flush { border-top: 0; }
      /* Symmetric: sections sit between two dividers, so an uneven top/bottom
         (was 32/34) made the content look fractionally high in its own band. */
      .rk-pad { padding: 76px var(--rk-gutter); }
      /* The wordmark doubles as the way home from a club. Inherits colour so it
         never picks up default link styling — it should read as the mark, not a
         link, until you hover it. */
      .rk-homelink { color: inherit; text-decoration: none; transition: opacity .14s ease; }
      .rk-homelink:hover { opacity: .62; }
      .rk-wordmark { font-family: var(--rk-font-wordmark); font-weight: 800; letter-spacing: -.04em; color: var(--rk-ink); line-height: 1; }

      /* Hero: pitch left, working board right, sharing the first screen. The
         board is the demonstration, so it gets the larger share. */
      .rk-lp-hero { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: 64px;
                    align-items: center; padding: 72px var(--lp-gutter) 80px; border-bottom: 1px solid var(--rk-line);
                    position: relative; }
      .rk-lp-hero-copy, .rk-lp-hero-board { position: relative; z-index: 1; min-width: 0; }
      .rk-lp-hero .rk-lp-h1 { font-size: clamp(34px, 4.4vw, 60px); }
      .rk-lp-hero .rk-lp-sub { margin-top: 22px; max-width: 40ch; }
      .rk-lp-hero .rk-lp-hero-cta { margin-top: 30px; }
      .rk-lp-hero .rk-lp-spot-tabs { margin-top: 0; }
      .rk-lp-board-meta { font: 400 12px/1.4 var(--rk-font); color: var(--rk-grey); }
      @media (max-width: 900px) {
        /* Stacks: the board drops under the pitch rather than shrinking to a
           width where the names and figures collide. */
        .rk-lp-hero { grid-template-columns: minmax(0, 1fr); gap: 40px; padding: 44px var(--lp-gutter) 52px; }
      }

      /* Entrance. Nothing on the page moved on arrival, which is most of why it
         read as rendered rather than designed. Sections rise as they come into
         view; board rows deal in from the top with a stagger. */
      @keyframes rk-rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
      .rk-reveal { opacity: 0; }
      .rk-reveal.is-in { animation: rk-rise .62s cubic-bezier(.16,1,.3,1) both; }
      @keyframes rk-deal { from { opacity: 0; transform: translateY(-10px); } }
      .rk-lp-racerow.is-dealt { animation: rk-deal .5s cubic-bezier(.16,1,.3,1) both; }
      @media (prefers-reduced-motion: reduce) {
        .rk-reveal, .rk-reveal.is-in { opacity: 1; animation: none; }
        .rk-lp-racerow.is-dealt { animation: none; }
      }

      /* ==========================================================================
         Landing page. Built from the board's own language rather than a generic
         hero: the club's exact header/footer construction, full-bleed hairlines,
         tracked caps, and the live figures at poster scale.
         ========================================================================== */
      /* Same 1040px column as the club, so the two read as one product
         rather than a wide marketing page bolted onto a narrow app. */
      .rk-landing { --lp-gutter: max(22px, calc((100vw - 1040px) / 2)); }
      /* Header/footer mirror the club's, so the two never read as separate sites. */
      .rk-lp-brandbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
                        padding: 16px var(--lp-gutter); border-bottom: 1px solid var(--rk-line); }
      /* Sticky, matching the club's own header — the two surfaces should feel
         like one product, and Request Access shouldn't scroll away now that the
         page runs to five sections. */
      .rk-lp-navbar { position: sticky; top: 0; z-index: 20; background: var(--rk-page); display: flex; justify-content: center; align-items: center; gap: 44px;
                      padding: 18px var(--lp-gutter); border-bottom: 1px solid var(--rk-line); }
      .rk-lp-navbar .rk-nav { text-decoration: none; }

      .rk-lp-statement { padding: 132px var(--lp-gutter) 112px; position: relative; overflow: hidden; }
      /* Content sits above the texture. */
      .rk-lp-h1, .rk-lp-sub, .rk-lp-hero-cta { position: relative; z-index: 1; }
      .rk-lp-h1 { margin: 0; font: 700 clamp(40px, 6.4vw, 92px)/.96 var(--rk-font); letter-spacing: -.032em;
                  text-transform: uppercase; color: var(--rk-title); }
      .rk-lp-sub { font: 400 18px/1.5 var(--rk-font); color: var(--rk-grey); margin: 28px 0 0; max-width: 46ch; }
      .rk-lp-hero-cta { display: flex; flex-wrap: wrap; align-items: center; gap: 28px; margin-top: 36px; }
      .rk-lp-cta-primary { font: 700 12.5px/1 var(--rk-font); letter-spacing: .06em; text-transform: uppercase;
                           color: var(--rk-paper); background: var(--rk-title); padding: 16px 24px; text-decoration: none;
                           transition: background .14s ease; }
      .rk-lp-cta-primary:hover { background: var(--rk-accent); }
      .rk-lp-cta-secondary { font: 500 12.5px/1 var(--rk-font); letter-spacing: .04em; text-transform: uppercase;
                             color: var(--rk-title); text-decoration: none; border-bottom: 1px solid var(--rk-line); padding-bottom: 4px; }
      .rk-lp-cta-secondary:hover { border-bottom-color: var(--rk-accent); color: var(--rk-accent); }

      /* A live club, rendered inline. Same table language as the board itself —
         hairline rows, tracked caps header, tabular figures, blue only on a
         category leader — so the landing shows the product instead of
         describing it. */
      .rk-lp-board { border-top: 1px solid var(--rk-line); padding: 76px var(--lp-gutter); }
      /* Left-aligned like every other heading on the page; only the card and
         the stakes row under it are centred. */
      .rk-lp-board-head { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; margin-bottom: 30px; text-align: left; }
      .rk-lp-board-sub { font: 400 16px/1.5 var(--rk-font); color: var(--rk-grey); margin: 12px 0 0; max-width: 44ch; }
      .rk-lp-board-cta { display: flex; justify-content: center; margin-top: 26px; }
      .rk-lp-board-name { font: 700 clamp(22px, 2.4vw, 32px)/1.1 var(--rk-font); letter-spacing: -.018em;
                          text-transform: uppercase; color: var(--rk-title); }
      .rk-lp-board-open { font: 500 12.5px/1 var(--rk-font); letter-spacing: .04em; text-transform: uppercase;
                          color: var(--rk-accent); text-decoration: none; white-space: nowrap; }
      .rk-lp-board-open:hover { text-decoration: underline; }



      /* The stakes, stated once under the table. */
      /* Preview card with the fade — the board is teased, not dumped, and the
         cut-off is the reason to open the club. */
      /* Bounded, not full-bleed — a leaderboard stretched across a wide screen
         opens a void between each name and its figure. */

      /* The race. Rows are absolutely positioned and moved only by transform,
         so switching category slides each team to its new rank instead of
         re-rendering the list — you watch someone take first place. */
      .rk-lp-race { position: relative; }
      .rk-lp-racerank { width: 20px; flex-shrink: 0; font: 700 13px/1 var(--rk-font); color: var(--rk-muted);
                        font-variant-numeric: tabular-nums; transition: color .3s ease; }
      .rk-lp-racecrest { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: none; }
      .rk-lp-racename { flex: 1; min-width: 0; font: 500 16px/1.2 var(--rk-font); letter-spacing: .012em; color: var(--rk-title);
                        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .rk-lp-racevalue { flex-shrink: 0; font: 500 15px/1 var(--rk-font); color: var(--rk-ink);
                         font-variant-numeric: tabular-nums; transition: color .3s ease, font-weight .3s ease; }
      /* Whoever is leading the category right now. */
      .rk-lp-racerow:hover { z-index: 2; }
      .rk-lp-racerow.is-first { z-index: 3; }
      .rk-lp-racerow.is-first .rk-lp-racerank,
      .rk-lp-racerow.is-first .rk-lp-racevalue { color: var(--rk-accent); font-weight: 700; }
      .rk-lp-racerow.is-first .rk-lp-racename { font-weight: 700; }
      @media (prefers-reduced-motion: reduce) { .rk-lp-racerow { transition: none; opacity: 1 !important; } }

      .rk-lp-spot-nav { display: flex; flex-wrap: wrap; gap: 30px; margin-top: 34px; }
      .rk-lp-spot-tab { background: none; border: 0; padding: 0 0 8px; cursor: pointer;
                        font: 400 11px/1 var(--rk-font); letter-spacing: .09em; text-transform: uppercase;
                        color: var(--rk-muted); border-bottom: 2px solid transparent; transition: color .16s ease, border-color .16s ease; }
      .rk-lp-spot-tab.is-on { color: var(--rk-title); border-bottom-color: var(--rk-accent); }
      .rk-lp-spot-tab:hover { color: var(--rk-title); }

      .rk-lp-stakes { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 10px 30px;
                      margin: 30px auto 0; padding-top: 24px; border-top: 1px solid var(--rk-line); max-width: 560px; }
      .rk-lp-stake-item { display: inline-flex; align-items: baseline; gap: 8px;
                          font: 400 10.5px/1 var(--rk-font); letter-spacing: .05em; text-transform: uppercase; color: var(--rk-muted); }
      .rk-lp-stake-amt { font-weight: 700; color: var(--rk-accent); }

      /* Sport breadth. Same column rhythm as the board, hairline-divided. The
         running sport is marked; the others are the same machinery unstarted. */
      .rk-lp-sports { border-top: 1px solid var(--rk-line); padding: 76px var(--lp-gutter) 14px; }
      .rk-lp-sports-head { font: 700 clamp(22px, 2.6vw, 34px)/1.2 var(--rk-font); letter-spacing: -.018em;
                           text-transform: uppercase; color: var(--rk-title); max-width: 22ch; }
      .rk-lp-sports-sub { font: 400 17px/1.5 var(--rk-font); color: var(--rk-grey); margin: 16px 0 0; max-width: 46ch; }
      .rk-lp-sports-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 54px; }
      .rk-lp-sport { padding: 34px 40px 62px 0; min-width: 0; border-top: 1px solid var(--rk-line); }
      .rk-lp-sport + .rk-lp-sport { border-left: 1px solid var(--rk-line); padding-left: 40px; }
      .rk-lp-sport-name { font: 700 10.5px/1 var(--rk-font); letter-spacing: .09em; text-transform: uppercase; color: var(--rk-muted); }
      .rk-lp-sport.is-live .rk-lp-sport-name { color: var(--rk-accent); }
      .rk-lp-sport-bets { list-style: none; margin: 20px 0 0; padding: 0; }
      .rk-lp-sport-bets li { font: 400 16px/1.75 var(--rk-font); color: var(--rk-grey); }
      .rk-lp-sport.is-live .rk-lp-sport-bets li { color: var(--rk-title); }

      /* Platforms. A league owner's first question is whether theirs is here, so
         the state is stated plainly rather than implied by logo presence. */
      .rk-lp-platforms { border-top: 1px solid var(--rk-line); padding: 76px var(--lp-gutter); }
      .rk-lp-platforms-label { font: 400 10.5px/1 var(--rk-font); letter-spacing: .05em; text-transform: uppercase; color: var(--rk-muted); }
      .rk-lp-platforms-row { display: flex; flex-wrap: wrap; gap: 14px 40px; margin-top: 22px; align-items: baseline; }
      .rk-lp-platform { display: inline-flex; align-items: baseline; gap: 10px;
                        font: 700 20px/1 var(--rk-font); letter-spacing: -.012em; color: var(--rk-muted); }
      .rk-lp-platform.is-live { color: var(--rk-title); }
      .rk-lp-platform-logo { height: 22px; width: auto; flex-shrink: 0; align-self: center; }
      .rk-lp-platform-name { white-space: nowrap; }
      .rk-lp-platform.is-live { color: var(--rk-title); }
      .rk-lp-platform-state { font: 400 9.5px/1 var(--rk-font); letter-spacing: .07em; text-transform: uppercase; color: var(--rk-muted); }
      .rk-lp-platform.is-live .rk-lp-platform-state { color: var(--rk-accent); }

      .rk-lp-request { border-top: 1px solid var(--rk-line); padding: 76px var(--lp-gutter); }
      .rk-lp-request-head { font: 700 27px/1.05 var(--rk-font); letter-spacing: -.012em; text-transform: uppercase; color: var(--rk-title); }
      .rk-lp-request-sub { font: 400 17px/1.5 var(--rk-font); color: var(--rk-grey); margin: 16px 0 0; max-width: 46ch; }
      .rk-lp-form { margin-top: 24px; max-width: 520px; }
      .rk-lp-field { display: flex; align-items: center; gap: 16px; border-bottom: 1px solid var(--rk-title); padding-bottom: 12px; }
      .rk-lp-input { flex: 1; min-width: 0; border: 0; background: none; padding: 0; font: 400 17px/1.3 var(--rk-font); color: var(--rk-title); }
      .rk-lp-input::placeholder { color: var(--rk-muted); }
      .rk-lp-input:focus { outline: none; }
      .rk-lp-submit { flex-shrink: 0; background: none; border: 0; padding: 0; cursor: pointer;
                      font: 500 13px/1 var(--rk-font); letter-spacing: .04em; text-transform: uppercase; color: var(--rk-accent); white-space: nowrap; }
      .rk-lp-submit:hover { text-decoration: underline; }
      .rk-lp-sent { font: 500 17px/1.3 var(--rk-font); color: var(--rk-accent); border-bottom: 1px solid var(--rk-line); padding-bottom: 12px; }

      .rk-lp-foot { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 12px;
                    border-top: 1px solid var(--rk-line); padding: 18px var(--lp-gutter); margin-top: 48px; }
      .rk-lp-legal { justify-self: end; text-align: right; font: 400 10px/1.5 var(--rk-font); color: var(--rk-muted); }

      @media (max-width: 900px) {
        .rk-landing { --lp-gutter: 16px; }
        .rk-lp-navbar { gap: 18px; }
        .rk-lp-statement { padding: 64px var(--lp-gutter) 56px; }
        /* 2x2 — the same shape the board's own Leaders grid takes on mobile */
        .rk-lp-board { padding: 52px var(--lp-gutter); }
        .rk-lp-board-head { flex-direction: column; align-items: flex-start; gap: 14px; margin-bottom: 24px; }
        /* Drop to two stat columns on a phone; the club's own table does the same. */
        /* All four categories stay — "the four categories are consistent
           everywhere" is the product's premise, so dropping two here broke the
           one rule the club never breaks. Columns tighten instead. */
        .rk-lp-stakes { gap: 8px 18px; }
        .rk-lp-sports { padding: 52px var(--lp-gutter) 8px; }
        .rk-lp-sports-sub { font-size: 15.5px; margin-top: 14px; }
        .rk-lp-sports-grid { grid-template-columns: 1fr; margin-top: 34px; }
        .rk-lp-sport { padding: 26px var(--lp-gutter) 34px 0; padding-left: var(--lp-gutter); }
        .rk-lp-sport + .rk-lp-sport { border-left: 0; padding-left: var(--lp-gutter); }
        .rk-lp-platforms { padding: 52px var(--lp-gutter); }
        .rk-lp-platforms-row { gap: 12px 26px; }
        .rk-lp-platform { font-size: 18px; }
        .rk-lp-request { padding: 52px var(--lp-gutter); }
        .rk-lp-request-sub { font-size: 15.5px; margin-top: 14px; }
        .rk-lp-foot { grid-template-columns: 1fr; gap: 12px; }
        .rk-lp-legal { justify-self: start; text-align: left; }
      }

      /* Awards — 4 across, full hairline grid. minmax(0,1fr)+min-width:0 stops nowrap
         team names from pushing the grid past the card (see handoff grid rule). */
      /* Un-boxed: 4 columns on white, divided by vertical hairlines only. */
      .rk-awards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .rk-award { min-width: 0; padding: 0 18px; border-left: 1px solid var(--rk-line); display: flex; flex-direction: column; gap: 9px; }
      .rk-award:first-child { border-left: 0; padding-left: 0; }
      .rk-award-team { display: flex; align-items: center; gap: 7px; min-width: 0; margin-top: 1px; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; width: 100%; }
      /* Countdown under the categories — deliberately a caption, not a headline:
         NO extra hairline (the section divider below already separates these,
         and a second rule 38px away is just noise), and the number stays near
         label size so it can't compete with the four award figures, which are
         the only numbers in this section meant to carry weight. Accent on the
         count alone, consistent with blue marking what's live or at stake. */
      .rk-countdown { display: flex; align-items: baseline; gap: 7px; margin-top: 18px; font: 400 10.5px/1 var(--rk-font); letter-spacing: .03em; text-transform: uppercase; color: var(--rk-muted); }
      /* Ink, not accent: blue is reserved for what's live or leading, and a
         countdown is neither — it's context. Weight alone carries it. */
      .rk-countdown-n { font: 700 12px/1 var(--rk-font); color: var(--rk-title); font-variant-numeric: tabular-nums; }
      .rk-award-team span:last-child { min-width: 0; }
      /* How far clear the leader is, and over whom — quiet, below the team. */
      /* margin-top:auto pins this to the bottom of the cell, so the four lines
         stay level even when a tie makes one cell list 2–3 teams. */
      /* margin-top:auto (not extra padding on top of the flex gap, which
         doubled the visual space) pins this to the bottom so all four cells
         stay level even when a tie lists 2-3 teams. */
      .rk-margin { font: 400 12px/1.4 var(--rk-font); color: var(--rk-grey); margin-top: auto; }

      /* Payout line — dashed rule marking the last paid finishing spot. */
      .rk-payout-line { display: flex; align-items: center; gap: 10px; margin: 0; padding: 9px 0; }
      /* Same type treatment as the eyebrows/column heads (Regular 10.5px caps,
         .03em) but in the accent — this line marks who's in the money, which is
         exactly what blue is reserved for. */
      .rk-payout-line span { font: 400 10.5px/1 var(--rk-font); letter-spacing: .03em; text-transform: uppercase; color: var(--rk-accent); white-space: nowrap; }
      /* Dashes softened so the rule reads as a divider, not a second headline. */
      .rk-payout-line::after { content: ""; flex: 1; border-top: 1px dashed var(--rk-accent); opacity: .4; }

      /* Standings + splits rows — full-bleed grids divided by hairlines */
      .rk-row { display: grid; align-items: center; gap: 9px; }
      /* Four EVEN stat columns, wide enough to hold "239 +1" side by side. Both
         tables use the same four widths so HR/AVG/Wins/ERA line up vertically
         between Standings and Weekly Splits. */
      /* Four EVEN stat columns, each narrower than Record — a stat is 2–4 chars,
         a record is up to 9 ("125-58-9"). Team stays flexible so it absorbs the
         row's slack; the stat block therefore anchors to the right edge, which
         is what keeps it aligned with Weekly Splits below. */
      /* Team is fixed and RECORD absorbs the row's slack. Record's text is
         left-aligned in its column, so it sits right beside the team name
         instead of drifting out next to the stats — while the stat block still
         anchors to the right edge, keeping it aligned with Weekly Splits. */
      .rk-standings-row { grid-template-columns: 22px 260px minmax(84px,1fr) repeat(4, 72px); }
      /* Week | Dates | stats — parallel to Standings' Team | Record | stats.
         The stat block anchors to the row's right edge regardless of what's
         in front of it, so this doesn't need to match Standings column-for-
         column to keep HR/AVG/Wins/ERA aligned between the two tables. */
      /* Same construction as Standings: Week fixed, DATES absorbs the slack so
         it sits beside the week label. 291 + 9 == 22 + 260 + 9 + 9, so Dates
         starts at the same x as Record above. */
      .rk-splits-row     { grid-template-columns: 291px minmax(92px,1fr) repeat(4, 72px); }
      /* Table hairlines stay inside the content column — only SECTION dividers
         run edge-to-edge. Hence no negative gutter margin on these. */
      /* 28px matches the gap under the Leaders head — both sit directly beneath
         a 27px section head, so they should breathe the same. */
      .rk-head { margin: 28px 0 0; padding: 0 0 11px; border-bottom: 1px solid var(--rk-line); }
      /* Every data row is the same height — a fixed min-height with vertically
         centred content, so a stacked live delta or a two-line week label can't
         make one row taller than its neighbours. */
      .rk-trow { margin: 0; padding: 6px 0; min-height: 58px; border-bottom: 1px solid var(--rk-line); cursor: pointer; transition: background .16s ease; }
      .rk-trow:hover { background: var(--rk-hover); }
      /* Selected = a slightly deeper neutral fill than hover. No accent bar —
         the fill alone carries it. */
      .rk-trow.is-sel { background: var(--rk-sel); }
      .rk-trow.is-last { border-bottom: 0; }
      /* The dashed payout line below already separates this row — don't double up. */
      .rk-trow.is-prepay { border-bottom: 0; }
      .rk-splits-row.rk-head { margin-top: 16px; }
      .rk-splits-trow { margin: 0; padding: 6px 0; min-height: 58px; border-bottom: 1px solid var(--rk-line); }
      .rk-splits-total { margin: 0; padding: 13px 0; border-top: 2px solid var(--rk-line); }
      /* Current-week marker — a single accent dot after the week label. */
      .rk-week-live { width: 6px; height: 6px; border-radius: 50%; background: var(--rk-accent); flex-shrink: 0; display: inline-block; }
      /* Left-aligned to the table's own grid (it was centred, floating free of
         every other row), and set in the same bold-caps control language as
         the nav/eyebrows so it reads as a control rather than a stray line of
         body text. The caret gives it an explicit expand/collapse affordance. */
      /* Right-aligned, underlined text link in the title colour — reads as a
         deliberate action rather than a stray caption. Wrapper handles the
         right alignment so the underline hugs the text, not the full row. */
      .rk-view-all-row { display: flex; justify-content: flex-end; margin-top: 14px; }
      .rk-view-all { display: inline-flex; align-items: center; gap: 6px; padding: 0; font: 500 10.5px/1 var(--rk-font); letter-spacing: .03em; text-transform: uppercase; color: var(--rk-title); background: none; border: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; transition: opacity .14s ease; }
      .rk-view-all:hover { opacity: .6; }
      /* Stat columns centre their copy — headers and values alike, in both
         tables, so the four categories read as one aligned block. */
      .rk-cell-num { text-align: center; }
      /* The delta must NOT be part of what gets centered — if "239 +1" centers
         as one cluster, the "239" itself sits left of true-center (to make
         room for the +1), so the number wanders off the column's centerline
         on any row that has a delta, while plain numbers stay dead-center.
         That mismatch is what read as "uneven columns": position:absolute
         takes the delta out of flow entirely, so .rk-cell-num's text-align:
         center always centers the number ALONE, in the exact same spot,
         delta or no delta. The delta then hangs off the number's own right
         edge without shifting it. */
      .rk-stat { position: relative; display: inline-block; }
      .rk-stat-delta { position: absolute; left: 100%; top: 50%; transform: translateY(-50%); margin-left: 4px; font: 500 10px/1 var(--rk-font); font-variant-numeric: tabular-nums; white-space: nowrap; }
      .rk-team { display: flex; align-items: center; gap: 9px; min-width: 0; }
      .rk-team-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      /* Empty state — recedes on several axes (well fill + grey + opacity) */
      /* Sized to its content — a tall empty box reads as a loading failure. */
      /* No opacity dim — this state is a real picker (tappable team chips), not
         a passive placeholder, so it shouldn't read as inactive/disabled. */

      /* Payouts modal — two columns divided by a hairline; stacks on mobile */
      .rk-payouts { display: grid; grid-template-columns: 1fr 1fr; }
      .rk-pay-col + .rk-pay-col { border-left: 1px solid var(--rk-line); }

      /* ---- Mobile (≈390px): section heads shrink, awards go 2×2, record hides ---- */
      @media (max-width: 560px) {
        /* Gutter, row gaps and the team avatar all give up a few px so the stat
           columns can widen enough to hold "227 +4" on ONE line. Harvesting the
           space here rather than from the name column means only the longest
           name clips — taking it all from the name truncated 7 of 8. */
        :root { --rk-gutter: 12px; }
        .rk-shell { padding: 6px 0 16px; }
        /* Steps down from 27px, but stays well above the old 19px so the heads
           read as display type on mobile too. */
        .rk-section-head { font-size: 23px; white-space: normal; }
        /* Bold, and a step above the 13px team names: the league is the page's
           subject, so it shouldn't sit smaller than the items inside it. Kept
           well under the 19px section heads (and the ~18px one-line ceiling)
           since this lives in the sticky header, which stays compact. */
        .rk-league-title { font-size: 14.5px; font-weight: 700; white-space: nowrap; }
        /* Smaller + tighter so "2026 SEASON · 8 TEAMS · UPDATED 2:02 PM" reliably
           fits one line on a 375px screen — verified with real headroom, not a
           knife's-edge fit. */
        .rk-meta-line { font-size: 10.5px; letter-spacing: .025em; gap: 6px; margin-top: 6px; }
        .rk-body { font-size: 13px; }
        .rk-caveat { font-size: 11.5px; }
        /* Steps down from 62px, but stays the largest thing on the screen —
           the 2×2 grid only gives each figure about half the width. */
        .rk-figure { font-size: 46px; }
        /* Desktop's 76px surrounds four full-width figures, so it reads as
           composition; in a narrow column the same value is just a dead band
           above the heading. Scale the air with the content it frames. */
        .rk-pad { padding: 52px var(--rk-gutter); }
        /* Condensed header: the three stacked bars cost ~210px of an 812px
           screen, so trim their vertical padding and the wordmark. */
        .rk-brandbar { padding-top: 9px !important; padding-bottom: 9px !important; }
        .rk-wordmark-top { font-size: 20px !important; }
        .rk-navbar { padding-top: 13px !important; padding-bottom: 13px !important; }
        .rk-nav { font-size: 12.5px; }
        .rk-identity { padding-top: 15px !important; padding-bottom: 15px !important; }
        /* 2×2 on mobile: vertical hairline between the columns, horizontal between the rows. */
        .rk-awards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .rk-award { padding: 0 0 0 16px; }
        .rk-award:nth-child(odd) { border-left: 0; padding-left: 0; }
        .rk-award:nth-child(even) { border-left: 1px solid var(--rk-line); }
        .rk-award:nth-child(1), .rk-award:nth-child(2) { padding-bottom: 18px; }
        .rk-award:nth-child(3), .rk-award:nth-child(4) { border-top: 1px solid var(--rk-line); padding-top: 18px; }
        /* 46px columns fit figure + inline gain; 4px gaps and an 18px avatar pay
           for most of it, so the name column only gives up ~8px. */
        /* 14px rank: every name came up exactly 1px short of its natural width
           (sub-pixel rounding, not a real shortfall) and ellipsised for it. */
        .rk-standings-row { grid-template-columns: 14px minmax(0,1fr) repeat(4, 46px); gap: 4px; }
        .rk-splits-row { grid-template-columns: minmax(0,1fr) repeat(4, 46px); gap: 4px; }
        .rk-team-name { font-size: 13px; letter-spacing: .01em; }
        .rk-team { gap: 5px; }
        .rk-trow .bt-teammark { width: 18px !important; height: 18px !important; }
        /* At 13px the stat figures — the actual content of this app — read thin
           at Regular. Step the whole numeric stack up one weight on mobile, and
           make the two that anchor a row (rank, category leader) genuinely bold
           so there's a clear hierarchy instead of a uniformly light table. */
        .rk-data { font-size: 13px; font-weight: 500; }
        .rk-data.is-leader { font-weight: 700; }
        .rk-data.is-rank { font-weight: 700; }
        .rk-trow, .rk-splits-trow { min-height: 52px; }
        /* Columns are now wide enough for the gain to sit INLINE, so rows stay
           single-line and can never shift vertically. It stays absolutely
           positioned off the figure's right edge — in flow it would push the
           figure off the column's centreline on gaining rows only. */
        .rk-stat-delta { font-size: 9px; margin-left: 3px; }
        .rk-is-record { display: none !important; }
        /* No room for a fixed Dates column at 375px — same trade-off as
           hiding Record in Standings above. */
        .rk-is-dates { display: none !important; }
        .rk-payouts { grid-template-columns: 1fr; }
        .rk-pay-col + .rk-pay-col { border-left: 0; border-top: 1px solid var(--rk-line); }
      }

      /* ---- How it works ---------------------------------------------------- */
      .rk-lp-how { border-top: 1px solid var(--rk-line); padding: 76px var(--lp-gutter) 14px; }
      .rk-lp-how-head { font: 700 27px/1.05 var(--rk-font); letter-spacing: -.012em; text-transform: uppercase; color: var(--rk-title); }
      .rk-lp-how-sub { font: 400 17px/1.5 var(--rk-font); color: var(--rk-grey); max-width: 46ch; margin: 16px 0 0; }
      .rk-lp-how-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 54px; }
      .rk-lp-step { border-top: 1px solid var(--rk-line); padding: 28px 40px 62px 0; min-width: 0; }
      .rk-lp-step:nth-child(2) { border-left: 1px solid var(--rk-line); padding: 28px 40px 62px; }
      .rk-lp-step:nth-child(3) { border-left: 1px solid var(--rk-line); padding: 28px 0 62px 40px; }
      .rk-lp-step-n { font: 700 clamp(40px, 4.4vw, 56px)/1 var(--rk-font); letter-spacing: -.03em; color: var(--rk-line); }
      .rk-lp-step-head { font: 700 20px/1.2 var(--rk-font); letter-spacing: -.012em; text-transform: uppercase; color: var(--rk-title); margin-top: 14px; }
      .rk-lp-step-body { font: 400 16px/1.6 var(--rk-font); color: var(--rk-grey); margin: 12px 0 0; text-wrap: pretty; }

      /* ---- Board ----------------------------------------------------------- */
      /* flex-direction must be reset explicitly — an earlier .rk-lp-board-head
         sets column, and inheriting that with align-items:center centred the
         heading horizontally instead of sitting the badge beside it. */
      .rk-lp-board-head { display: flex; flex-direction: row; align-items: center; gap: 14px; flex-wrap: wrap; text-align: left; }
      .rk-lp-board-name { font: 700 27px/1.05 var(--rk-font); letter-spacing: -.012em; text-transform: uppercase; color: var(--rk-title); }
      .rk-lp-board-sub { font: 400 17px/1.5 var(--rk-font); color: var(--rk-grey); max-width: 48ch; margin: 16px 0 0; }
      .rk-lp-spot-tabs { display: flex; flex-wrap: wrap; gap: 30px; margin-top: 38px; }
      .rk-lp-spot-tab { font: 400 11px/1 var(--rk-font); letter-spacing: .09em; text-transform: uppercase; color: var(--rk-muted);
                        background: none; border: 0; border-bottom: 2px solid transparent; padding: 0 0 10px; cursor: pointer; transition: color .15s ease; }
      .rk-lp-spot-tab:hover { color: var(--rk-title); }
      .rk-lp-spot-tab.is-active { color: var(--rk-title); border-bottom-color: var(--rk-accent); }
      .rk-lp-board-body { display: flex; flex-wrap: wrap; align-items: stretch; gap: 40px; margin-top: 30px; }
      /* border-top:0 — the first row draws its own hairline, so a container top
         border would double it. */
      .rk-lp-card { flex: 1 1 400px; min-width: 0; border: 1px solid var(--rk-line); border-top: 0; padding: 0 22px; }
      .rk-lp-race { position: relative; }
      /* border-TOP, not bottom: with rows moving by transform, a top border stays
         attached to the row above the name rather than trailing it. */
      .rk-lp-racerow { /* Full-bleed inside the card: the card pads 22px, so without cancelling
                         it every row hairline stopped short of the card's own border and
                         read as a missing line. Content keeps the inset via padding. */
                       position: absolute; background: var(--rk-page); left: -22px; right: -22px; padding: 0 22px; height: 64px; display: flex; align-items: center; gap: 13px;
                       border-top: 1px solid var(--rk-line);
                       transition: transform .55s cubic-bezier(.32, .72, 0, 1), opacity .3s ease; will-change: transform; }
      .rk-lp-racerank { width: 20px; font: 700 13px/1 var(--rk-font); font-variant-numeric: tabular-nums; color: var(--rk-muted); }
      .rk-lp-racerow.is-first .rk-lp-racerank { color: var(--rk-accent); }
      /* No fill behind the crest — an empty slot should read as nothing there,
         not as a grey placeholder chip. */
      .rk-lp-racecrest { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: none; flex-shrink: 0; }
      .rk-lp-racename { flex: 1; min-width: 0; font: 500 16px/1.2 var(--rk-font); letter-spacing: .018em; color: var(--rk-title);
                        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .rk-lp-racerow.is-first .rk-lp-racename { font-weight: 700; }
      .rk-lp-racevalue { font: 500 18px/1 var(--rk-font); font-variant-numeric: tabular-nums; color: var(--rk-ink); }
      .rk-lp-racerow.is-first .rk-lp-racevalue { font-weight: 700; color: var(--rk-accent); }
      .rk-lp-spot { flex: 0 1 288px; min-width: 240px; display: flex; flex-direction: column; padding-top: 4px; }
      .rk-lp-spot-eyebrow { font: 400 10.5px/1 var(--rk-font); letter-spacing: .05em; text-transform: uppercase; color: var(--rk-muted); }
      /* 62px/.88 overflows its box upward ~4px, so this needs clearance from the
         tabs' 2px underline. */
      .rk-lp-spot-figure { font: 700 62px/.88 var(--rk-font); letter-spacing: -.022em; color: var(--rk-accent);
                           font-variant-numeric: tabular-nums; margin-top: 16px; }
      .rk-lp-spot-team { font: 500 12.5px/1.25 var(--rk-font); letter-spacing: .012em; color: var(--rk-ink); margin-top: 14px; }
      .rk-lp-spot-margin { font: 400 12px/1.4 var(--rk-font); color: var(--rk-grey); margin-top: 5px; }
      .rk-lp-spot-stake { margin-top: auto; padding-top: 26px; border-top: 1px solid var(--rk-line); display: flex; justify-content: space-between; align-items: baseline; }
      .rk-lp-spot-stake-l { font: 400 10.5px/1 var(--rk-font); letter-spacing: .05em; text-transform: uppercase; color: var(--rk-muted); }
      .rk-lp-spot-stake-v { font: 700 20px/1 var(--rk-font); color: var(--rk-title); font-variant-numeric: tabular-nums; }
      .rk-lp-board-foot { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px 14px; margin-top: 22px; }
      .rk-lp-board-meta { font: 400 12px/1.4 var(--rk-font); color: var(--rk-grey); }
      .rk-lp-board-count { margin-left: auto; display: inline-flex; align-items: baseline; gap: 6px; }
      .rk-lp-board-count-n { font: 700 12px/1 var(--rk-font); color: var(--rk-title); font-variant-numeric: tabular-nums; }
      .rk-lp-board-count-l { font: 400 10.5px/1 var(--rk-font); letter-spacing: .03em; text-transform: uppercase; color: var(--rk-muted); }

      /* ---- Image band ------------------------------------------------------ */
      /* Two columns, not an absolute overlay — the flap was landing on top of
         the headline as soon as the copy wrapped to two lines. */
      .rk-lp-band { position: relative; overflow: hidden; background: #0A0A0A;
                    display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 48px;
                    padding: 64px var(--lp-gutter); min-height: clamp(320px, 32vw, 400px); }
      .rk-lp-band-photo { position: absolute; top: 0; right: 0; bottom: 0; width: 62%;
                          -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 46%);
                          mask-image: linear-gradient(to right, transparent 0%, #000 46%); }
      .rk-lp-band-photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; }
      /* Split-flap board. Each cell is a card with a hairline across its
         midline — the seam a real flap board has — and the digit flips in on
         rotateX from above, so it reads as mechanical rather than a fade. */
      /* order, not DOM position: the flap markup sits before the copy (it's
         painted with the band's texture), but it belongs in the right column. */
      .rk-lp-flap { display: flex; gap: 10px; z-index: 1; pointer-events: none; order: 2; }
      .rk-lp-flap-cell { position: relative; width: clamp(52px, 6vw, 86px); height: clamp(70px, 8vw, 116px);
                         background: #16181D; border: 1px solid #23262B; overflow: hidden;
                         display: flex; align-items: center; justify-content: center; perspective: 320px; }
      /* the seam */
      .rk-lp-flap-cell::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px;
                                background: #0A0A0A; z-index: 2; }
      .rk-lp-flap-digit { font: 700 clamp(40px, 4.8vw, 68px)/1 var(--rk-font); letter-spacing: -.02em;
                          color: #EDEDED; font-variant-numeric: tabular-nums;
                          /* Must complete inside one roll tick (90ms) — at .16s each digit
                             restarted mid-rotation and sat edge-on, so the board read blank. */
                          animation: rk-flap .075s cubic-bezier(.4,0,.2,1); transform-origin: 50% 0; }
      @keyframes rk-flap { from { transform: rotateX(-88deg); opacity: .25; } to { transform: none; opacity: 1; } }
      @media (max-width: 900px) {
        /* Stacks — there isn't width for type and board side by side. */
        .rk-lp-band { grid-template-columns: minmax(0,1fr); gap: 30px; }
      }
      @media (prefers-reduced-motion: reduce) { .rk-lp-flap-digit { animation: none; } }

      /* Ground-coloured dots over the dark band, densest at the right and
         dissolving leftward — the mark's own matrix standing in for imagery. */
      .rk-lp-band-dots { position: absolute; inset: 0; pointer-events: none;
                         background-image: radial-gradient(circle, rgba(255,255,255,.16) 1.1px, transparent 1.1px);
                         background-size: 7px 7px;
                         -webkit-mask-image: linear-gradient(to right, transparent 34%, #000 100%);
                         mask-image: linear-gradient(to right, transparent 34%, #000 100%); }
      .rk-lp-band-type { position: relative; z-index: 1; min-width: 0; order: 1; }
      .rk-lp-band-head { font: 700 clamp(30px, 3.6vw, 48px)/1.04 var(--rk-font); letter-spacing: -.028em; text-transform: uppercase;
                         color: #EDEDED; text-wrap: balance; }
      /* px, not ch — ch resolves against this wrapper's 16px, which wrapped the
         48px headline to five lines. */
      .rk-lp-band-sub { font: 400 16px/1.6 var(--rk-font); color: #A8A8A8; margin: 18px 0 0; max-width: 420px; }

      @media (prefers-reduced-motion: reduce) { .rk-lp-racerow { transition: none; } }
      @media (max-width: 900px) {
        .rk-lp-how-grid { grid-template-columns: 1fr; }
        .rk-lp-step, .rk-lp-step:nth-child(2), .rk-lp-step:nth-child(3) { border-left: 0; padding: 24px 0 40px; }
        .rk-lp-board-body { gap: 30px; }
        .rk-lp-spot { flex: 1 1 100%; }
        .rk-lp-band { min-height: 0; padding: 48px var(--lp-gutter); }
        .rk-lp-band-photo { width: 100%; opacity: .5; }
        .rk-lp-board-count { margin-left: 0; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
